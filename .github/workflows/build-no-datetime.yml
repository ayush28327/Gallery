              patch_hide_remaining_datetime_ui()
              patch_properties_dialogs()
              patch_vault_menus()
              patch_vault_search_triggers()
              patch_batch_vault_menu()
              create_metadata_stripper()
              patch_share_auto_strip()
              patch_metadata_menus()
              print("All No-DateTime + Private Vault patches applied successfully.")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as err:
                  print(f"PATCH ERROR: {err}", file=sys.stderr)
                  sys.exit(1)
          PYEOF

      - name: Build universal FOSS release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/foss/release -name "*foss-release*.apk" ! -name "*armeabi*" ! -name "*arm64*" ! -name "*x86*" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/foss/release -name "*.apk" | head -n 1)
          fi
          echo "Signing: $RAW_APK"

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "ERROR: Missing KEYSTORE_BASE64 or KEYSTORE_PASS repository secrets." >&2
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > custom.keystore

          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks custom.keystore \
            --ks-key-alias gallerykey \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEYSTORE_PASS \
            --out FossifyGallery-NoDateTime.apk \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify FossifyGallery-NoDateTime.apk
          rm -f custom.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FossifyGallery-NoDateTime
          path: FossifyGallery-NoDateTime.apk
