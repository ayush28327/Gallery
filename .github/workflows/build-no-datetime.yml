name: Build No-DateTime APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply No-DateTime and Private Vault patches
        run: |
          python3 << 'PYEOF'
          import pathlib
          import re
          import sys

          ROOT = pathlib.Path("app/src/main/kotlin/org/fossify/gallery")
          MANIFEST = pathlib.Path("app/src/main/AndroidManifest.xml")
          LAYOUT_DIR = pathlib.Path("app/src/main/res/layout")

          def read_file(path: pathlib.Path) -> str:
              try:
                  return path.read_text(encoding="utf-8")
              except OSError as exc:
                  raise RuntimeError(f"Failed to read {path}: {exc}") from exc

          def write_file(path: pathlib.Path, content: str) -> None:
              try:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding="utf-8")
              except OSError as exc:
                  raise RuntimeError(f"Failed to write {path}: {exc}") from exc

          def create_properties_helper() -> None:
              helper = ROOT / "helpers/NoDatePropertiesHelper.kt"
              content = """package org.fossify.gallery.helpers

          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          import com.qtalk.recyclerviewfastscroller.RecyclerViewFastScroller
          import org.fossify.commons.dialogs.BasePropertiesDialog
          import org.fossify.commons.dialogs.PropertiesDialog

          fun PropertiesDialog.stripDateRows(): PropertiesDialog {
              val propertyView = try {
                  val field = BasePropertiesDialog::class.java.getDeclaredField("mPropertyView")
                  field.isAccessible = true
                  field.get(this) as? ViewGroup
              } catch (_: Throwable) {
                  null
              } ?: return this

              val context = propertyView.context
              val blockedLabels = setOf(
                  context.getString(org.fossify.commons.R.string.last_modified),
                  context.getString(org.fossify.commons.R.string.date_taken),
              )

              fun hideIfDateRow(child: View?) {
                  val labelView = child?.findViewById<TextView>(org.fossify.commons.R.id.property_label) ?: return
                  val label = labelView.text?.toString()?.trim().orEmpty()
                  val lower = label.lowercase()
                  if (label in blockedLabels || "date" in lower || "modified" in lower) {
                      child.visibility = View.GONE
                  }
              }

              for (i in 0 until propertyView.childCount) {
                  hideIfDateRow(propertyView.getChildAt(i))
              }
              propertyView.setOnHierarchyChangeListener(object : ViewGroup.OnHierarchyChangeListener {
                  override fun onChildViewAdded(parent: View?, child: View?) {
                      hideIfDateRow(child)
                  }

                  override fun onChildViewRemoved(parent: View?, child: View?) = Unit
              })
              return this
          }

          fun RecyclerViewFastScroller.disableCompletely() {
              isFastScrollEnabled = false
              val hideFastScrollerViews = {
                  try {
                      popupTextView.visibility = View.GONE
                      popupTextView.text = ""
                  } catch (_: Throwable) {
                  }
                  for (i in 0 until childCount) {
                      val child = getChildAt(i)
                      if (child !is RecyclerView) {
                          child.visibility = View.GONE
                          child.isEnabled = false
                          child.setOnTouchListener { _, _ -> false }
                      }
                  }
              }
              hideFastScrollerViews()
              post { hideFastScrollerViews() }
          }
          """
              write_file(helper, content)
              print(f"Created {helper}")

          def create_vault_manager() -> None:
              helper = ROOT / "helpers/VaultManager.kt"
              content = """package org.fossify.gallery.helpers

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Environment
          import android.provider.DocumentsContract
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.text.InputFilter
          import android.text.InputType
          import android.view.WindowManager
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import com.bumptech.glide.Glide
          import org.fossify.gallery.activities.VaultActivity
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.RandomAccessFile
          import java.security.MessageDigest
          import java.util.Locale
          import kotlin.concurrent.thread

          object VaultManager {
              const val EXTRA_IS_DECOY = "vault_is_decoy"
              private const val VAULT_DIR_NAME = "private_vault_291006"
              private const val DECOY_DIR_NAME = "private_vault_decoy"
              private const val PREFS_NAME = "vault_security_prefs"
              private const val KEY_FAILED_ATTEMPTS = "failed_attempts"
              private const val KEY_REAL_HASH = "real_passcode_hash"
              private const val KEY_DECOY_HASH = "decoy_passcode_hash"
              private const val DEFAULT_REAL_HASH = "306acf33281a4aabc8d21e26068177babb4d5e2e0fe3c7b5f9c008245c579f8b"
              private const val DEFAULT_DECOY_HASH = "91b4d142823f7d20c5f08df69122de43f35f057a988d9619f6d3138485c9a203"
              private const val MAX_FAILED_ATTEMPTS = 3
              private val VIDEO_EXTENSIONS = setOf("mp4", "mkv", "webm", "mov", "3gp", "avi", "m4v")

              private fun sha256(value: String): String {
                  val digest = MessageDigest.getInstance("SHA-256").digest(value.toByteArray(Charsets.UTF_8))
                  return digest.joinToString("") { "%02x".format(it) }
              }

              private fun getRealHash(context: Context): String {
                  return context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_REAL_HASH, DEFAULT_REAL_HASH) ?: DEFAULT_REAL_HASH
              }

              private fun getDecoyHash(context: Context): String {
                  return context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .getString(KEY_DECOY_HASH, DEFAULT_DECOY_HASH) ?: DEFAULT_DECOY_HASH
              }

              private fun isRealPasscode(context: Context, code: String): Boolean {
                  return sha256(code) == getRealHash(context)
              }

              private fun isDecoyPasscode(context: Context, code: String): Boolean {
                  return sha256(code) == getDecoyHash(context)
              }

              private fun getFailedAttempts(context: Context): Int {
                  return context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .getInt(KEY_FAILED_ATTEMPTS, 0)
              }

              private fun setFailedAttempts(context: Context, count: Int) {
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                      .edit()
                      .putInt(KEY_FAILED_ATTEMPTS, count)
                      .commit()
              }

              fun isVideoFile(file: File): Boolean {
                  val ext = file.name.substringAfterLast('.', "").lowercase(Locale.US)
                  return ext in VIDEO_EXTENSIONS
              }

              private fun secureDeleteFile(file: File) {
                  try {
                      if (file.isFile && file.length() > 0L) {
                          val wipeBytes = minOf(file.length(), 65536L).toInt()
                          RandomAccessFile(file, "rw").use { raf ->
                              raf.seek(0L)
                              raf.write(ByteArray(wipeBytes))
                              raf.fd.sync()
                          }
                      }
                  } catch (_: Throwable) {
                  }
                  try {
                      file.delete()
                  } catch (_: Throwable) {
                  }
              }

              private fun wipeVaultCompletely(activity: Activity) {
                  setFailedAttempts(activity, 0)
                  try {
                      Glide.get(activity.applicationContext).clearMemory()
                  } catch (_: Throwable) {
                  }
                  thread {
                      try {
                          getVaultDir(activity, isDecoy = false).listFiles()?.forEach { file ->
                              secureDeleteFile(file)
                          }
                      } catch (_: Throwable) {
                      }
                      try {
                          Glide.get(activity.applicationContext).clearDiskCache()
                      } catch (_: Throwable) {
                      }
                  }
              }

              fun getVaultDir(context: Context, isDecoy: Boolean = false): File {
                  val name = if (isDecoy) DECOY_DIR_NAME else VAULT_DIR_NAME
                  val dir = File(context.filesDir, name)
                  if (!dir.exists()) {
                      dir.mkdirs()
                  }
                  return dir
              }

              fun listVaultFiles(context: Context, isDecoy: Boolean = false): List<File> {
                  return getVaultDir(context, isDecoy)
                      .listFiles()
                      ?.filter { it.isFile && it.length() > 0L }
                      ?.sortedByDescending { it.lastModified() }
                      ?: emptyList()
              }

              private fun openVault(activity: Activity, isDecoy: Boolean) {
                  val intent = Intent(activity, VaultActivity::class.java).apply {
                      putExtra(EXTRA_IS_DECOY, isDecoy)
                  }
                  activity.startActivity(intent)
              }

              fun handleSearchQuery(activity: Activity, query: String, onTriggered: () -> Unit): Boolean {
                  val trimmed = query.trim()
                  if (trimmed == "#vault") {
                      onTriggered()
                      promptAndOpenVault(activity)
                      return true
                  }
                  if (trimmed.length == 6 && trimmed.all { it.isDigit() }) {
                      if (isRealPasscode(activity, trimmed)) {
                          setFailedAttempts(activity, 0)
                          onTriggered()
                          openVault(activity, isDecoy = false)
                          return true
                      }
                      if (isDecoyPasscode(activity, trimmed)) {
                          setFailedAttempts(activity, 0)
                          onTriggered()
                          openVault(activity, isDecoy = true)
                          return true
                      }
                  }
                  return false
              }

              fun promptAndOpenVault(activity: Activity) {
                  val input = EditText(activity).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      filters = arrayOf(InputFilter.LengthFilter(6))
                      hint = "Enter 6-digit passcode"
                  }
                  val dialog = AlertDialog.Builder(activity)
                      .setTitle("Private Vault")
                      .setView(input)
                      .setPositiveButton("Unlock") { _, _ ->
                          val entered = input.text?.toString().orEmpty()
                          if (entered.isEmpty()) {
                              Toast.makeText(activity, "Enter passcode", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }
                          when {
                              isRealPasscode(activity, entered) -> {
                                  setFailedAttempts(activity, 0)
                                  openVault(activity, isDecoy = false)
                              }
                              isDecoyPasscode(activity, entered) -> {
                                  setFailedAttempts(activity, 0)
                                  openVault(activity, isDecoy = true)
                              }
                              else -> {
                                  val attempts = getFailedAttempts(activity) + 1
                                  if (attempts > MAX_FAILED_ATTEMPTS) {
                                      wipeVaultCompletely(activity)
                                      Toast.makeText(
                                          activity,
                                          "Too many wrong attempts. Vault cleared.",
                                          Toast.LENGTH_LONG,
                                      ).show()
                                  } else {
                                      setFailedAttempts(activity, attempts)
                                      val left = (MAX_FAILED_ATTEMPTS + 1) - attempts
                                      val msg = if (left == 1) {
                                          "Incorrect passcode (LAST attempt before auto-wipe!)"
                                      } else {
                                          "Incorrect passcode ($left attempts left before auto-wipe)"
                                      }
                                      Toast.makeText(activity, msg, Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .create()
                  dialog.window?.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE,
                  )
                  dialog.show()
              }

              fun promptChangePasscodes(activity: Activity) {
                  val container = LinearLayout(activity).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 24, 48, 12)
                  }
                  fun makePinInput(hintText: String): EditText = EditText(activity).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      filters = arrayOf(InputFilter.LengthFilter(6))
                      hint = hintText
                  }
                  val currentInput = makePinInput("Current 6-digit real passcode")
                  val newRealInput = makePinInput("New real passcode (6 digits, optional)")
                  val newDecoyInput = makePinInput("New decoy passcode (6 digits, optional)")
                  val note = TextView(activity).apply {
                      text = "Leave a field blank to keep its current passcode."
                      textSize = 12f
                  }
                  container.addView(currentInput)
                  container.addView(newRealInput)
                  container.addView(newDecoyInput)
                  container.addView(note)

                  val dialog = AlertDialog.Builder(activity)
                      .setTitle("Change Vault Passcodes")
                      .setView(container)
                      .setPositiveButton("Save") { _, _ ->
                          val current = currentInput.text?.toString().orEmpty()
                          val newReal = newRealInput.text?.toString().orEmpty()
                          val newDecoy = newDecoyInput.text?.toString().orEmpty()

                          if (!isRealPasscode(activity, current)) {
                              Toast.makeText(activity, "Current passcode is incorrect", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }
                          if (newReal.isEmpty() && newDecoy.isEmpty()) {
                              Toast.makeText(activity, "No changes entered", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }
                          if (newReal.isNotEmpty() && (newReal.length != 6 || !newReal.all { it.isDigit() })) {
                              Toast.makeText(activity, "Real passcode must be 6 digits", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }
                          if (newDecoy.isNotEmpty() && (newDecoy.length != 6 || !newDecoy.all { it.isDigit() })) {
                              Toast.makeText(activity, "Decoy passcode must be 6 digits", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }

                          val finalRealHash = if (newReal.isNotEmpty()) sha256(newReal) else getRealHash(activity)
                          val finalDecoyHash = if (newDecoy.isNotEmpty()) sha256(newDecoy) else getDecoyHash(activity)
                          if (finalRealHash == finalDecoyHash) {
                              Toast.makeText(activity, "Real and decoy passcodes must be different", Toast.LENGTH_LONG).show()
                              return@setPositiveButton
                          }

                          activity.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
                              .edit()
                              .putString(KEY_REAL_HASH, finalRealHash)
                              .putString(KEY_DECOY_HASH, finalDecoyHash)
                              .commit()
                          Toast.makeText(activity, "Vault passcodes updated", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancel", null)
                      .create()
                  dialog.window?.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE,
                  )
                  dialog.show()
              }

              private fun moveSingleFileSync(activity: Activity, sourcePath: String, isDecoy: Boolean): String? {
                  val src = File(sourcePath)
                  if (!src.exists() || !src.isFile) {
                      return "File not found"
                  }

                  val destName = "${System.currentTimeMillis()}_${src.name}"
                  val dest = File(getVaultDir(activity, isDecoy), destName)
                  FileInputStream(src).use { input ->
                      FileOutputStream(dest).use { output ->
                          input.copyTo(output)
                      }
                  }

                  if (!dest.exists() || dest.length() != src.length()) {
                      dest.delete()
                      return "Copy verification failed"
                  }

                  val deleted = src.delete()
                  if (!deleted && src.exists()) {
                      val rows = activity.contentResolver.delete(
                          MediaStore.Files.getContentUri("external"),
                          "${MediaStore.MediaColumns.DATA} = ?",
                          arrayOf(sourcePath),
                      )
                      if (rows <= 0 && src.exists()) {
                          dest.delete()
                          return "Could not remove original. Grant All Files Access in Settings."
                      }
                  } else {
                      try {
                          activity.contentResolver.delete(
                              MediaStore.Files.getContentUri("external"),
                              "${MediaStore.MediaColumns.DATA} = ?",
                              arrayOf(sourcePath),
                          )
                      } catch (_: Throwable) {
                      }
                  }

                  MediaScannerConnection.scanFile(activity, arrayOf(sourcePath), null, null)
                  return null
              }

              fun moveToVault(activity: Activity, sourcePath: String, onSuccess: () -> Unit = {}) {
                  thread {
                      try {
                          val error = moveSingleFileSync(activity, sourcePath, isDecoy = false)
                          activity.runOnUiThread {
                              if (error == null) {
                                  Toast.makeText(activity, "Archived", Toast.LENGTH_SHORT).show()
                                  onSuccess()
                              } else {
                                  Toast.makeText(activity, error, Toast.LENGTH_LONG).show()
                              }
                          }
                      } catch (e: Throwable) {
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Archive failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              fun moveMultipleToVault(activity: Activity, sourcePaths: List<String>, onComplete: () -> Unit = {}) {
                  if (sourcePaths.isEmpty()) return
                  thread {
                      var movedCount = 0
                      var lastError: String? = null
                      for (path in sourcePaths) {
                          try {
                              val err = moveSingleFileSync(activity, path, isDecoy = false)
                              if (err == null) {
                                  movedCount++
                              } else {
                                  lastError = err
                              }
                          } catch (e: Throwable) {
                              lastError = e.message
                          }
                      }
                      activity.runOnUiThread {
                          val msg = when {
                              movedCount > 0 && lastError == null ->
                                  "Archived $movedCount ${if (movedCount == 1) "item" else "items"}"
                              movedCount > 0 ->
                                  "Archived $movedCount/${sourcePaths.size} items ($lastError)"
                              else ->
                                  "Archive failed: ${lastError ?: "Unknown error"}"
                          }
                          Toast.makeText(activity, msg, Toast.LENGTH_LONG).show()
                          onComplete()
                      }
                  }
              }

              fun importUriToVault(activity: Activity, uri: Uri, isDecoy: Boolean = false, onComplete: (Boolean) -> Unit) {
                  thread {
                      try {
                          val mime = activity.contentResolver.getType(uri).orEmpty()
                          val defaultExt = if (mime.startsWith("video/")) "mp4" else "jpg"
                          var displayName = "item_${System.currentTimeMillis()}.$defaultExt"
                          activity.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->
                              if (cursor.moveToFirst()) {
                                  val name = cursor.getString(0)
                                  if (!name.isNullOrBlank()) {
                                      displayName = name
                                  }
                              }
                          }

                          val dest = File(getVaultDir(activity, isDecoy), "${System.currentTimeMillis()}_$displayName")
                          activity.contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(dest).use { output ->
                                  input.copyTo(output)
                              }
                          } ?: throw IllegalStateException("Cannot read selected file")

                          var deletedOriginal = false
                          try {
                              deletedOriginal = DocumentsContract.deleteDocument(activity.contentResolver, uri)
                          } catch (_: Throwable) {
                          }

                          activity.runOnUiThread {
                              val msg = if (deletedOriginal) {
                                  "Archived"
                              } else {
                                  "Copied to Vault (delete original if still visible)"
                              }
                              Toast.makeText(activity, msg, Toast.LENGTH_SHORT).show()
                              onComplete(true)
                          }
                      } catch (e: Throwable) {
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Import failed: ${e.message}", Toast.LENGTH_LONG).show()
                              onComplete(false)
                          }
                      }
                  }
              }

              fun restoreFromVault(activity: Activity, vaultFile: File, onSuccess: () -> Unit) {
                  thread {
                      try {
                          val picturesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES)
                          val restoreDir = File(picturesDir, "VaultRestored").apply { mkdirs() }
                          val cleanName = vaultFile.name.substringAfter("_", vaultFile.name)
                          var dest = File(restoreDir, cleanName)
                          if (dest.exists()) {
                              dest = File(restoreDir, "${System.currentTimeMillis()}_$cleanName")
                          }

                          FileInputStream(vaultFile).use { input ->
                              FileOutputStream(dest).use { output ->
                                  input.copyTo(output)
                              }
                          }

                          if (dest.exists() && dest.length() == vaultFile.length()) {
                              vaultFile.delete()
                              MediaScannerConnection.scanFile(activity, arrayOf(dest.absolutePath), null, null)
                              activity.runOnUiThread {
                                  Toast.makeText(activity, "Restored to Pictures/VaultRestored", Toast.LENGTH_SHORT).show()
                                  onSuccess()
                              }
                          } else {
                              dest.delete()
                              throw IllegalStateException("Restore verification failed")
                          }
                      } catch (e: Throwable) {
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Restore failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              fun restoreMultipleFromVault(activity: Activity, vaultFiles: List<File>, onComplete: () -> Unit) {
                  if (vaultFiles.isEmpty()) return
                  thread {
                      var restored = 0
                      val picturesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES)
                      val restoreDir = File(picturesDir, "VaultRestored").apply { mkdirs() }
                      val scanned = mutableListOf<String>()
                      for (vaultFile in vaultFiles) {
                          try {
                              val cleanName = vaultFile.name.substringAfter("_", vaultFile.name)
                              var dest = File(restoreDir, cleanName)
                              if (dest.exists()) {
                                  dest = File(restoreDir, "${System.currentTimeMillis()}_$cleanName")
                              }
                              FileInputStream(vaultFile).use { input ->
                                  FileOutputStream(dest).use { output ->
                                      input.copyTo(output)
                                  }
                              }
                              if (dest.exists() && dest.length() == vaultFile.length()) {
                                  vaultFile.delete()
                                  scanned.add(dest.absolutePath)
                                  restored++
                              } else {
                                  dest.delete()
                              }
                          } catch (_: Throwable) {
                          }
                      }
                      if (scanned.isNotEmpty()) {
                          MediaScannerConnection.scanFile(activity, scanned.toTypedArray(), null, null)
                      }
                      activity.runOnUiThread {
                          Toast.makeText(
                              activity,
                              "Restored $restored ${if (restored == 1) "item" else "items"} to Pictures/VaultRestored",
                              Toast.LENGTH_SHORT,
                          ).show()
                          onComplete()
                      }
                  }
              }
          }
          """
              write_file(helper, content)
              print(f"Created {helper}")

          def create_vault_activity() -> None:
              act = ROOT / "activities/VaultActivity.kt"
              content = """package org.fossify.gallery.activities

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.Context
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import androidx.recyclerview.widget.RecyclerView
          import androidx.viewpager2.widget.ViewPager2
          import com.alexvasilkov.gestures.GestureImageView
          import com.bumptech.glide.Glide
          import com.bumptech.glide.load.DecodeFormat
          import com.bumptech.glide.request.RequestOptions
          import org.fossify.gallery.helpers.VaultManager
          import java.io.File

          class VaultActivity : Activity() {
              private val PICK_MEDIA_REQUEST = 9910
              private val INACTIVITY_TIMEOUT_MS = 120_000L
              private val inactivityHandler = Handler(Looper.getMainLooper())
              private val autoLockRunnable = Runnable {
                  if (!pickingExternal && !isFinishing) {
                      Toast.makeText(this, "Vault locked due to inactivity", Toast.LENGTH_SHORT).show()
                      finish()
                  }
              }

              private var isDecoy = false
              private lateinit var gridContainer: LinearLayout
              private lateinit var normalTopBar: LinearLayout
              private lateinit var selectionTopBar: LinearLayout
              private lateinit var selectionTitle: TextView
              private lateinit var gridView: GridView
              private lateinit var emptyLabel: TextView
              private lateinit var viewerContainer: FrameLayout
              private lateinit var viewPager: ViewPager2
              private lateinit var viewerTopBar: LinearLayout
              private lateinit var viewerBottomBar: LinearLayout
              private lateinit var viewerCounter: TextView
              private var vaultFiles: List<File> = emptyList()
              private val selectedPaths = LinkedHashSet<String>()
              private var selectionMode = false
              private var pickingExternal = false
              private var viewerBarsVisible = true
              private var activeVideoView: VideoView? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  isDecoy = intent.getBooleanExtra(VaultManager.EXTRA_IS_DECOY, false)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE,
                  )

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                  }

                  gridContainer = buildGridContainer()
                  viewerContainer = buildViewerContainer()
                  viewerContainer.visibility = View.GONE

                  root.addView(gridContainer)
                  root.addView(viewerContainer)
                  setContentView(root)

                  refreshVaultData()
                  resetInactivityTimer()
              }

              override fun onResume() {
                  super.onResume()
                  resetInactivityTimer()
              }

              override fun onUserInteraction() {
                  super.onUserInteraction()
                  resetInactivityTimer()
              }

              override fun onDestroy() {
                  inactivityHandler.removeCallbacks(autoLockRunnable)
                  stopActiveVideo()
                  super.onDestroy()
              }

              private fun resetInactivityTimer() {
                  inactivityHandler.removeCallbacks(autoLockRunnable)
                  inactivityHandler.postDelayed(autoLockRunnable, INACTIVITY_TIMEOUT_MS)
              }

              private fun stopActiveVideo() {
                  try {
                      activeVideoView?.stopPlayback()
                  } catch (_: Throwable) {
                  }
                  activeVideoView = null
              }

              private fun buildGridContainer(): LinearLayout {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                  }

                  normalTopBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(24, 48, 24, 24)
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                  }

                  val title = TextView(this).apply {
                      text = "Private Vault"
                      textSize = 19f
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val addBtn = Button(this).apply {
                      text = "+ Add"
                      setOnClickListener { openMediaPicker() }
                  }

                  val lockBtn = Button(this).apply {
                      text = "Lock"
                      setOnClickListener { finish() }
                  }

                  normalTopBar.addView(title)
                  normalTopBar.addView(addBtn)
                  if (!isDecoy) {
                      val pinBtn = Button(this).apply {
                          text = "PIN"
                          setOnClickListener { VaultManager.promptChangePasscodes(this@VaultActivity) }
                      }
                      normalTopBar.addView(pinBtn)
                  }
                  normalTopBar.addView(lockBtn)

                  selectionTopBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(16, 48, 16, 24)
                      setBackgroundColor(Color.parseColor("#263238"))
                      visibility = View.GONE
                  }

                  selectionTitle = TextView(this).apply {
                      text = "0 selected"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val selectAllBtn = Button(this).apply {
                      text = "All"
                      setOnClickListener { toggleSelectAll() }
                  }

                  val batchRestoreBtn = Button(this).apply {
                      text = "Restore"
                      setOnClickListener { restoreSelectedItems() }
                  }

                  val batchDeleteBtn = Button(this).apply {
                      text = "Delete"
                      setOnClickListener { deleteSelectedItems() }
                  }

                  val cancelSelBtn = Button(this).apply {
                      text = "X"
                      setOnClickListener { exitSelectionMode() }
                  }

                  selectionTopBar.addView(selectionTitle)
                  selectionTopBar.addView(selectAllBtn)
                  selectionTopBar.addView(batchRestoreBtn)
                  selectionTopBar.addView(batchDeleteBtn)
                  selectionTopBar.addView(cancelSelBtn)

                  emptyLabel = TextView(this).apply {
                      text = "No hidden items yet.\\nUse '+ Add' or select photos/videos -> Archive."
                      setTextColor(Color.LTGRAY)
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(48, 96, 48, 48)
                  }

                  gridView = GridView(this).apply {
                      numColumns = 3
                      horizontalSpacing = 8
                      verticalSpacing = 8
                      setPadding(8, 8, 8, 8)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f,
                      )
                      setOnItemClickListener { _, _, position, _ ->
                          if (selectionMode) {
                              toggleSelectionAt(position)
                          } else {
                              openFullScreenViewer(position)
                          }
                      }
                      setOnItemLongClickListener { _, _, position, _ ->
                          if (!selectionMode) {
                              selectionMode = true
                          }
                          toggleSelectionAt(position)
                          true
                      }
                  }

                  container.addView(normalTopBar)
                  container.addView(selectionTopBar)
                  container.addView(emptyLabel)
                  container.addView(gridView)
                  return container
              }

              private fun updateSelectionBar() {
                  if (selectionMode && selectedPaths.isNotEmpty()) {
                      normalTopBar.visibility = View.GONE
                      selectionTopBar.visibility = View.VISIBLE
                      selectionTitle.text = "${selectedPaths.size} selected"
                  } else {
                      selectionMode = false
                      selectedPaths.clear()
                      selectionTopBar.visibility = View.GONE
                      normalTopBar.visibility = View.VISIBLE
                  }
                  (gridView.adapter as? BaseAdapter)?.notifyDataSetChanged()
              }

              private fun toggleSelectionAt(position: Int) {
                  val file = vaultFiles.getOrNull(position) ?: return
                  val path = file.absolutePath
                  if (!selectedPaths.add(path)) {
                      selectedPaths.remove(path)
                  }
                  updateSelectionBar()
              }

              private fun toggleSelectAll() {
                  if (selectedPaths.size == vaultFiles.size) {
                      selectedPaths.clear()
                  } else {
                      selectedPaths.clear()
                      vaultFiles.forEach { selectedPaths.add(it.absolutePath) }
                  }
                  updateSelectionBar()
              }

              private fun exitSelectionMode() {
                  selectionMode = false
                  selectedPaths.clear()
                  updateSelectionBar()
              }

              private fun restoreSelectedItems() {
                  val files = vaultFiles.filter { it.absolutePath in selectedPaths }
                  if (files.isEmpty()) return
                  VaultManager.restoreMultipleFromVault(this, files) {
                      exitSelectionMode()
                      refreshVaultData()
                  }
              }

              private fun deleteSelectedItems() {
                  val files = vaultFiles.filter { it.absolutePath in selectedPaths }
                  if (files.isEmpty()) return
                  AlertDialog.Builder(this)
                      .setTitle("Delete ${files.size} ${if (files.size == 1) "item" else "items"} permanently?")
                      .setMessage("Selected items will be permanently deleted from the vault.")
                      .setPositiveButton("Delete") { _, _ ->
                          var deleted = 0
                          files.forEach { file ->
                              if (file.delete()) deleted++
                          }
                          Toast.makeText(this, "Deleted $deleted ${if (deleted == 1) "item" else "items"}", Toast.LENGTH_SHORT).show()
                          exitSelectionMode()
                          refreshVaultData()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun buildViewerContainer(): FrameLayout {
                  val container = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                  }

                  viewPager = ViewPager2(this).apply {
                      orientation = ViewPager2.ORIENTATION_HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                      registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                          override fun onPageSelected(position: Int) {
                              stopActiveVideo()
                              updateCounter(position)
                          }
                      })
                  }

                  viewerTopBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#AA000000"))
                      setPadding(24, 56, 24, 24)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP,
                      )
                  }

                  val backBtn = Button(this).apply {
                      text = "Back"
                      setOnClickListener { closeFullScreenViewer() }
                  }

                  viewerCounter = TextView(this).apply {
                      textSize = 17f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.END
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  viewerTopBar.addView(backBtn)
                  viewerTopBar.addView(viewerCounter)

                  viewerBottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#AA000000"))
                      setPadding(24, 24, 24, 48)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM,
                      )
                  }

                  val restoreBtn = Button(this).apply {
                      text = "Restore"
                      setOnClickListener { restoreCurrentViewerItem() }
                  }

                  val deleteBtn = Button(this).apply {
                      text = "Delete"
                      setOnClickListener { deleteCurrentViewerItem() }
                  }

                  viewerBottomBar.addView(restoreBtn)
                  viewerBottomBar.addView(deleteBtn)

                  container.addView(viewPager)
                  container.addView(viewerTopBar)
                  container.addView(viewerBottomBar)
                  return container
              }

              private fun openFullScreenViewer(position: Int) {
                  if (vaultFiles.isEmpty()) return
                  stopActiveVideo()
                  val safePos = position.coerceIn(0, vaultFiles.lastIndex)
                  viewPager.adapter = VaultPagerAdapter(vaultFiles)
                  viewPager.setCurrentItem(safePos, false)
                  updateCounter(safePos)
                  viewerBarsVisible = true
                  viewerTopBar.visibility = View.VISIBLE
                  viewerBottomBar.visibility = View.VISIBLE
                  viewerContainer.visibility = View.VISIBLE
                  gridContainer.visibility = View.GONE
              }

              private fun closeFullScreenViewer() {
                  stopActiveVideo()
                  viewerContainer.visibility = View.GONE
                  gridContainer.visibility = View.VISIBLE
              }

              private fun toggleViewerBars() {
                  viewerBarsVisible = !viewerBarsVisible
                  val vis = if (viewerBarsVisible) View.VISIBLE else View.GONE
                  viewerTopBar.visibility = vis
                  viewerBottomBar.visibility = vis
              }

              private fun updateCounter(position: Int) {
                  if (vaultFiles.isEmpty()) {
                      viewerCounter.text = ""
                  } else {
                      viewerCounter.text = "${position + 1} / ${vaultFiles.size}"
                  }
              }

              private fun restoreCurrentViewerItem() {
                  val pos = viewPager.currentItem
                  val file = vaultFiles.getOrNull(pos) ?: return
                  stopActiveVideo()
                  VaultManager.restoreFromVault(this, file) {
                      refreshVaultData(keepViewerAt = pos)
                  }
              }

              private fun deleteCurrentViewerItem() {
                  val pos = viewPager.currentItem
                  val file = vaultFiles.getOrNull(pos) ?: return
                  AlertDialog.Builder(this)
                      .setTitle("Delete permanently?")
                      .setMessage("This item will be permanently deleted from the vault.")
                      .setPositiveButton("Delete") { _, _ ->
                          stopActiveVideo()
                          if (file.delete()) {
                              Toast.makeText(this, "Deleted", Toast.LENGTH_SHORT).show()
                              refreshVaultData(keepViewerAt = pos)
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  when {
                      viewerContainer.visibility == View.VISIBLE -> closeFullScreenViewer()
                      selectionMode -> exitSelectionMode()
                      else -> super.onBackPressed()
                  }
              }

              override fun onStop() {
                  super.onStop()
                  stopActiveVideo()
                  if (!pickingExternal) {
                      finish()
                  }
              }

              private fun openMediaPicker() {
                  pickingExternal = true
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "*/*"
                      putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                      putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  }
                  startActivityForResult(intent, PICK_MEDIA_REQUEST)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  pickingExternal = false
                  resetInactivityTimer()
                  if (requestCode == PICK_MEDIA_REQUEST && resultCode == RESULT_OK && data != null) {
                      val clipData = data.clipData
                      if (clipData != null) {
                          for (i in 0 until clipData.itemCount) {
                              val uri = clipData.getItemAt(i).uri
                              VaultManager.importUriToVault(this, uri, isDecoy) { refreshVaultData() }
                          }
                      } else {
                          data.data?.let { uri ->
                              VaultManager.importUriToVault(this, uri, isDecoy) { refreshVaultData() }
                          }
                      }
                  }
              }

              private fun refreshVaultData(keepViewerAt: Int? = null) {
                  vaultFiles = VaultManager.listVaultFiles(this, isDecoy)
                  emptyLabel.visibility = if (vaultFiles.isEmpty()) View.VISIBLE else View.GONE
                  gridView.visibility = if (vaultFiles.isEmpty()) View.GONE else View.VISIBLE
                  gridView.adapter = VaultGridAdapter(vaultFiles)

                  if (keepViewerAt != null && viewerContainer.visibility == View.VISIBLE) {
                      if (vaultFiles.isEmpty()) {
                          closeFullScreenViewer()
                      } else {
                          val nextPos = keepViewerAt.coerceIn(0, vaultFiles.lastIndex)
                          viewPager.adapter = VaultPagerAdapter(vaultFiles)
                          viewPager.setCurrentItem(nextPos, false)
                          updateCounter(nextPos)
                      }
                  }
              }

              private inner class VaultGridAdapter(private val items: List<File>) : BaseAdapter() {
                  override fun getCount(): Int = items.size
                  override fun getItem(position: Int): Any = items[position]
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val size = (resources.displayMetrics.widthPixels - 32) / 3
                      val tile = (convertView as? FrameLayout) ?: FrameLayout(this@VaultActivity).apply {
                          layoutParams = ViewGroup.LayoutParams(size, size)
                          val iv = ImageView(this@VaultActivity).apply {
                              layoutParams = FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                                  FrameLayout.LayoutParams.MATCH_PARENT,
                              )
                              scaleType = ImageView.ScaleType.CENTER_CROP
                              setBackgroundColor(Color.parseColor("#222222"))
                          }
                          val badge = TextView(this@VaultActivity).apply {
                              text = "▶"
                              textSize = 14f
                              setTextColor(Color.WHITE)
                              setBackgroundColor(Color.parseColor("#99000000"))
                              setPadding(12, 4, 12, 4)
                              layoutParams = FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.WRAP_CONTENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT,
                                  Gravity.BOTTOM or Gravity.END,
                              )
                          }
                          val checkOverlay = TextView(this@VaultActivity).apply {
                              text = "✓"
                              textSize = 16f
                              setTextColor(Color.WHITE)
                              setBackgroundColor(Color.parseColor("#CC1976D2"))
                              setPadding(14, 6, 14, 6)
                              layoutParams = FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.WRAP_CONTENT,
                                  FrameLayout.LayoutParams.WRAP_CONTENT,
                                  Gravity.TOP or Gravity.END,
                              )
                          }
                          addView(iv)
                          addView(badge)
                          addView(checkOverlay)
                      }
                      val file = items[position]
                      val iv = tile.getChildAt(0) as ImageView
                      val badge = tile.getChildAt(1) as TextView
                      val checkOverlay = tile.getChildAt(2) as TextView
                      val isSelected = file.absolutePath in selectedPaths
                      badge.visibility = if (VaultManager.isVideoFile(file)) View.VISIBLE else View.GONE
                      checkOverlay.visibility = if (isSelected) View.VISIBLE else View.GONE
                      iv.alpha = if (isSelected) 0.55f else 1.0f
                      Glide.with(this@VaultActivity).load(file).centerCrop().into(iv)
                      return tile
                  }
              }

              private inner class VaultPageHolder(
                  val root: FrameLayout,
                  val imageView: GestureImageView,
                  val videoView: VideoView,
                  val playButton: Button,
              ) : RecyclerView.ViewHolder(root)

              private inner class VaultPagerAdapter(private val items: List<File>) : RecyclerView.Adapter<VaultPageHolder>() {
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VaultPageHolder {
