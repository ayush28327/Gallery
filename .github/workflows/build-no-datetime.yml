          def hide_xml_views_by_id(xml_path: pathlib.Path, view_ids: list[str]) -> int:
              code = read_file(xml_path)
              total_hits = 0
              for vid in view_ids:
                  pattern = rf'(<[^>]*android:id="@\+id/{re.escape(vid)}"[^>]*?)(/?>)'
                  def _inject_gone(match: re.Match) -> str:
                      body, close = match.group(1), match.group(2)
                      if "android:visibility=" in body:
                          body = re.sub(r'android:visibility="[^"]*"', 'android:visibility="gone"', body)
                          return body + close
                      return body + '\n        android:visibility="gone"' + close
                  code, hits = re.subn(pattern, _inject_gone, code, count=1, flags=re.DOTALL)
                  if hits == 0:
                      raise RuntimeError(f"Could not find view id '{vid}' in {xml_path}")
                  total_hits += hits
              write_file(xml_path, code)
              print(f"Patched {xml_path} (hid {total_hits} date/time views)")
              return total_hits

