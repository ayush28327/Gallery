name: Build No-DateTime APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply No-DateTime and Private Vault patches
        run: |
          python3 << 'PYEOF'
          import pathlib
          import re
          import sys

          ROOT = pathlib.Path("app/src/main/kotlin/org/fossify/gallery")
          MANIFEST = pathlib.Path("app/src/main/AndroidManifest.xml")

          def read_file(path: pathlib.Path) -> str:
              try:
                  return path.read_text(encoding="utf-8")
              except OSError as exc:
                  raise RuntimeError(f"Failed to read {path}: {exc}") from exc

          def write_file(path: pathlib.Path, content: str) -> None:
              try:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding="utf-8")
              except OSError as exc:
                  raise RuntimeError(f"Failed to write {path}: {exc}") from exc

          def create_properties_helper() -> None:
              helper = ROOT / "helpers/NoDatePropertiesHelper.kt"
              content = """package org.fossify.gallery.helpers

          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import org.fossify.commons.dialogs.BasePropertiesDialog
          import org.fossify.commons.dialogs.PropertiesDialog

          fun PropertiesDialog.stripDateRows(): PropertiesDialog {
              val propertyView = try {
                  val field = BasePropertiesDialog::class.java.getDeclaredField("mPropertyView")
                  field.isAccessible = true
                  field.get(this) as? ViewGroup
              } catch (_: Throwable) {
                  null
              } ?: return this

              val context = propertyView.context
              val blockedLabels = setOf(
                  context.getString(org.fossify.commons.R.string.last_modified),
                  context.getString(org.fossify.commons.R.string.date_taken),
              )

              fun hideIfDateRow(child: View?) {
                  val labelView = child?.findViewById<TextView>(org.fossify.commons.R.id.property_label) ?: return
                  val label = labelView.text?.toString()?.trim().orEmpty()
                  if (label in blockedLabels) {
                      child.visibility = View.GONE
                  }
              }

              for (i in 0 until propertyView.childCount) {
                  hideIfDateRow(propertyView.getChildAt(i))
              }
              propertyView.setOnHierarchyChangeListener(object : ViewGroup.OnHierarchyChangeListener {
                  override fun onChildViewAdded(parent: View?, child: View?) {
                      hideIfDateRow(child)
                  }

                  override fun onChildViewRemoved(parent: View?, child: View?) = Unit
              })
              return this
          }
          """
              write_file(helper, content)
              print(f"Created {helper}")

          def create_vault_manager() -> None:
              helper = ROOT / "helpers/VaultManager.kt"
              content = """package org.fossify.gallery.helpers

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Environment
          import android.provider.DocumentsContract
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.text.InputFilter
          import android.text.InputType
          import android.widget.EditText
          import android.widget.Toast
          import org.fossify.gallery.activities.VaultActivity
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import kotlin.concurrent.thread

          object VaultManager {
              private const val PASSCODE = "291006"
              private const val VAULT_DIR_NAME = "private_vault_291006"

              fun getVaultDir(context: Context): File {
                  val dir = File(context.filesDir, VAULT_DIR_NAME)
                  if (!dir.exists()) {
                      dir.mkdirs()
                  }
                  return dir
              }

              fun listVaultFiles(context: Context): List<File> {
                  return getVaultDir(context)
                      .listFiles()
                      ?.filter { it.isFile && it.length() > 0L }
                      ?.sortedByDescending { it.lastModified() }
                      ?: emptyList()
              }

              fun promptAndOpenVault(activity: Activity) {
                  val input = EditText(activity).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      filters = arrayOf(InputFilter.LengthFilter(6))
                      hint = "Enter 6-digit passcode"
                  }
                  AlertDialog.Builder(activity)
                      .setTitle("Private Vault")
                      .setView(input)
                      .setPositiveButton("Unlock") { _, _ ->
                          if (input.text?.toString() == PASSCODE) {
                              val intent = Intent(activity, VaultActivity::class.java)
                              activity.startActivity(intent)
                          } else {
                              Toast.makeText(activity, "Incorrect passcode", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              fun moveToVault(activity: Activity, sourcePath: String, onSuccess: () -> Unit = {}) {
                  thread {
                      try {
                          val src = File(sourcePath)
                          if (!src.exists() || !src.isFile) {
                              activity.runOnUiThread {
                                  Toast.makeText(activity, "File not found", Toast.LENGTH_SHORT).show()
                              }
                              return@thread
                          }

                          val destName = "${System.currentTimeMillis()}_${src.name}"
                          val dest = File(getVaultDir(activity), destName)
                          FileInputStream(src).use { input ->
                              FileOutputStream(dest).use { output ->
                                  input.copyTo(output)
                              }
                          }

                          if (!dest.exists() || dest.length() != src.length()) {
                              dest.delete()
                              throw IllegalStateException("Copy verification failed")
                          }

                          val deleted = src.delete()
                          if (!deleted && src.exists()) {
                              val rows = activity.contentResolver.delete(
                                  MediaStore.Files.getContentUri("external"),
                                  "${MediaStore.MediaColumns.DATA} = ?",
                                  arrayOf(sourcePath),
                              )
                              if (rows <= 0 && src.exists()) {
                                  dest.delete()
                                  activity.runOnUiThread {
                                      Toast.makeText(
                                          activity,
                                          "Could not remove original. Grant All Files Access in Settings.",
                                          Toast.LENGTH_LONG,
                                      ).show()
                                  }
                                  return@thread
                              }
                          } else {
                              try {
                                  activity.contentResolver.delete(
                                      MediaStore.Files.getContentUri("external"),
                                      "${MediaStore.MediaColumns.DATA} = ?",
                                      arrayOf(sourcePath),
                                  )
                              } catch (_: Throwable) {
                              }
                          }

                          MediaScannerConnection.scanFile(activity, arrayOf(sourcePath), null, null)
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Moved to Private Vault", Toast.LENGTH_SHORT).show()
                              onSuccess()
                          }
                      } catch (e: Throwable) {
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Vault move failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              fun importUriToVault(activity: Activity, uri: Uri, onComplete: (Boolean) -> Unit) {
                  thread {
                      try {
                          var displayName = "item_${System.currentTimeMillis()}.jpg"
                          activity.contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->
                              if (cursor.moveToFirst()) {
                                  val name = cursor.getString(0)
                                  if (!name.isNullOrBlank()) {
                                      displayName = name
                                  }
                              }
                          }

                          val dest = File(getVaultDir(activity), "${System.currentTimeMillis()}_$displayName")
                          activity.contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(dest).use { output ->
                                  input.copyTo(output)
                              }
                          } ?: throw IllegalStateException("Cannot read selected file")

                          var deletedOriginal = false
                          try {
                              deletedOriginal = DocumentsContract.deleteDocument(activity.contentResolver, uri)
                          } catch (_: Throwable) {
                          }

                          activity.runOnUiThread {
                              val msg = if (deletedOriginal) {
                                  "Moved to Private Vault"
                              } else {
                                  "Copied to Vault (delete original if still visible)"
                              }
                              Toast.makeText(activity, msg, Toast.LENGTH_SHORT).show()
                              onComplete(true)
                          }
                      } catch (e: Throwable) {
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Import failed: ${e.message}", Toast.LENGTH_LONG).show()
                              onComplete(false)
                          }
                      }
                  }
              }

              fun restoreFromVault(activity: Activity, vaultFile: File, onSuccess: () -> Unit) {
                  thread {
                      try {
                          val picturesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_PICTURES)
                          val restoreDir = File(picturesDir, "VaultRestored").apply { mkdirs() }
                          val cleanName = vaultFile.name.substringAfter("_", vaultFile.name)
                          var dest = File(restoreDir, cleanName)
                          if (dest.exists()) {
                              dest = File(restoreDir, "${System.currentTimeMillis()}_$cleanName")
                          }

                          FileInputStream(vaultFile).use { input ->
                              FileOutputStream(dest).use { output ->
                                  input.copyTo(output)
                              }
                          }

                          if (dest.exists() && dest.length() == vaultFile.length()) {
                              vaultFile.delete()
                              MediaScannerConnection.scanFile(activity, arrayOf(dest.absolutePath), null, null)
                              activity.runOnUiThread {
                                  Toast.makeText(activity, "Restored to Pictures/VaultRestored", Toast.LENGTH_SHORT).show()
                                  onSuccess()
                              }
                          } else {
                              dest.delete()
                              throw IllegalStateException("Restore verification failed")
                          }
                      } catch (e: Throwable) {
                          activity.runOnUiThread {
                              Toast.makeText(activity, "Restore failed: ${e.message}", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }
          }
          """
              write_file(helper, content)
              print(f"Created {helper}")

          def create_vault_activity() -> None:
              act = ROOT / "activities/VaultActivity.kt"
              content = """package org.fossify.gallery.activities

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.RecyclerView
          import androidx.viewpager2.widget.ViewPager2
          import com.alexvasilkov.gestures.GestureImageView
          import com.bumptech.glide.Glide
          import org.fossify.gallery.helpers.VaultManager
          import java.io.File

          class VaultActivity : Activity() {
              private val PICK_MEDIA_REQUEST = 9910
              private lateinit var gridContainer: LinearLayout
              private lateinit var gridView: GridView
              private lateinit var emptyLabel: TextView
              private lateinit var viewerContainer: FrameLayout
              private lateinit var viewPager: ViewPager2
              private lateinit var viewerTopBar: LinearLayout
              private lateinit var viewerBottomBar: LinearLayout
              private lateinit var viewerCounter: TextView
              private var vaultFiles: List<File> = emptyList()
              private var pickingExternal = false
              private var viewerBarsVisible = true

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE,
                  )

                  val root = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      layoutParams = ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                  }

                  gridContainer = buildGridContainer()
                  viewerContainer = buildViewerContainer()
                  viewerContainer.visibility = View.GONE

                  root.addView(gridContainer)
                  root.addView(viewerContainer)
                  setContentView(root)

                  refreshVaultData()
              }

              private fun buildGridContainer(): LinearLayout {
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#121212"))
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                  }

                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(32, 48, 32, 24)
                      setBackgroundColor(Color.parseColor("#1E1E1E"))
                  }

                  val title = TextView(this).apply {
                      text = "Private Vault"
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val addBtn = Button(this).apply {
                      text = "+ Add"
                      setOnClickListener { openMediaPicker() }
                  }

                  val lockBtn = Button(this).apply {
                      text = "Lock"
                      setOnClickListener { finish() }
                  }

                  topBar.addView(title)
                  topBar.addView(addBtn)
                  topBar.addView(lockBtn)

                  emptyLabel = TextView(this).apply {
                      text = "No hidden photos yet.\\nUse '+ Add' or open any photo -> 3-dot menu -> Move to Vault."
                      setTextColor(Color.LTGRAY)
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(48, 96, 48, 48)
                  }

                  gridView = GridView(this).apply {
                      numColumns = 3
                      horizontalSpacing = 8
                      verticalSpacing = 8
                      setPadding(8, 8, 8, 8)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f,
                      )
                      setOnItemClickListener { _, _, position, _ ->
                          openFullScreenViewer(position)
                      }
                  }

                  container.addView(topBar)
                  container.addView(emptyLabel)
                  container.addView(gridView)
                  return container
              }

              private fun buildViewerContainer(): FrameLayout {
                  val container = FrameLayout(this).apply {
                      setBackgroundColor(Color.BLACK)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                  }

                  viewPager = ViewPager2(this).apply {
                      orientation = ViewPager2.ORIENTATION_HORIZONTAL
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                      )
                      registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                          override fun onPageSelected(position: Int) {
                              updateCounter(position)
                          }
                      })
                  }

                  viewerTopBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#AA000000"))
                      setPadding(24, 56, 24, 24)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP,
                      )
                  }

                  val backBtn = Button(this).apply {
                      text = "Back"
                      setOnClickListener { closeFullScreenViewer() }
                  }

                  viewerCounter = TextView(this).apply {
                      textSize = 17f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.END
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  viewerTopBar.addView(backBtn)
                  viewerTopBar.addView(viewerCounter)

                  viewerBottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.parseColor("#AA000000"))
                      setPadding(24, 24, 24, 48)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM,
                      )
                  }

                  val restoreBtn = Button(this).apply {
                      text = "Restore"
                      setOnClickListener { restoreCurrentViewerPhoto() }
                  }

                  val deleteBtn = Button(this).apply {
                      text = "Delete"
                      setOnClickListener { deleteCurrentViewerPhoto() }
                  }

                  viewerBottomBar.addView(restoreBtn)
                  viewerBottomBar.addView(deleteBtn)

                  container.addView(viewPager)
                  container.addView(viewerTopBar)
                  container.addView(viewerBottomBar)
                  return container
              }

              private fun openFullScreenViewer(position: Int) {
                  if (vaultFiles.isEmpty()) return
                  val safePos = position.coerceIn(0, vaultFiles.lastIndex)
                  viewPager.adapter = VaultPagerAdapter(vaultFiles)
                  viewPager.setCurrentItem(safePos, false)
                  updateCounter(safePos)
                  viewerBarsVisible = true
                  viewerTopBar.visibility = View.VISIBLE
                  viewerBottomBar.visibility = View.VISIBLE
                  viewerContainer.visibility = View.VISIBLE
                  gridContainer.visibility = View.GONE
              }

              private fun closeFullScreenViewer() {
                  viewerContainer.visibility = View.GONE
                  gridContainer.visibility = View.VISIBLE
              }

              private fun toggleViewerBars() {
                  viewerBarsVisible = !viewerBarsVisible
                  val vis = if (viewerBarsVisible) View.VISIBLE else View.GONE
                  viewerTopBar.visibility = vis
                  viewerBottomBar.visibility = vis
              }

              private fun updateCounter(position: Int) {
                  if (vaultFiles.isEmpty()) {
                      viewerCounter.text = ""
                  } else {
                      viewerCounter.text = "${position + 1} / ${vaultFiles.size}"
                  }
              }

              private fun restoreCurrentViewerPhoto() {
                  val pos = viewPager.currentItem
                  val file = vaultFiles.getOrNull(pos) ?: return
                  VaultManager.restoreFromVault(this, file) {
                      refreshVaultData(keepViewerAt = pos)
                  }
              }

              private fun deleteCurrentViewerPhoto() {
                  val pos = viewPager.currentItem
                  val file = vaultFiles.getOrNull(pos) ?: return
                  AlertDialog.Builder(this)
                      .setTitle("Delete permanently?")
                      .setMessage("This photo will be permanently deleted from the vault.")
                      .setPositiveButton("Delete") { _, _ ->
                          if (file.delete()) {
                              Toast.makeText(this, "Deleted", Toast.LENGTH_SHORT).show()
                              refreshVaultData(keepViewerAt = pos)
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (viewerContainer.visibility == View.VISIBLE) {
                      closeFullScreenViewer()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onStop() {
                  super.onStop()
                  if (!pickingExternal) {
                      finish()
                  }
              }

              private fun openMediaPicker() {
                  pickingExternal = true
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "image/*"
                      putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  }
                  startActivityForResult(intent, PICK_MEDIA_REQUEST)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  pickingExternal = false
                  if (requestCode == PICK_MEDIA_REQUEST && resultCode == RESULT_OK && data != null) {
                      val clipData = data.clipData
                      if (clipData != null) {
                          for (i in 0 until clipData.itemCount) {
                              val uri = clipData.getItemAt(i).uri
                              VaultManager.importUriToVault(this, uri) { refreshVaultData() }
                          }
                      } else {
                          data.data?.let { uri ->
                              VaultManager.importUriToVault(this, uri) { refreshVaultData() }
                          }
                      }
                  }
              }

              private fun refreshVaultData(keepViewerAt: Int? = null) {
                  vaultFiles = VaultManager.listVaultFiles(this)
                  emptyLabel.visibility = if (vaultFiles.isEmpty()) View.VISIBLE else View.GONE
                  gridView.visibility = if (vaultFiles.isEmpty()) View.GONE else View.VISIBLE
                  gridView.adapter = VaultGridAdapter(vaultFiles)

                  if (keepViewerAt != null && viewerContainer.visibility == View.VISIBLE) {
                      if (vaultFiles.isEmpty()) {
                          closeFullScreenViewer()
                      } else {
                          val nextPos = keepViewerAt.coerceIn(0, vaultFiles.lastIndex)
                          viewPager.adapter = VaultPagerAdapter(vaultFiles)
                          viewPager.setCurrentItem(nextPos, false)
                          updateCounter(nextPos)
                      }
                  }
              }

              private inner class VaultGridAdapter(private val items: List<File>) : BaseAdapter() {
                  override fun getCount(): Int = items.size
                  override fun getItem(position: Int): Any = items[position]
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val size = (resources.displayMetrics.widthPixels - 32) / 3
                      val iv = (convertView as? ImageView) ?: ImageView(this@VaultActivity).apply {
                          layoutParams = ViewGroup.LayoutParams(size, size)
                          scaleType = ImageView.ScaleType.CENTER_CROP
                          setBackgroundColor(Color.parseColor("#222222"))
                      }
                      Glide.with(this@VaultActivity).load(items[position]).centerCrop().into(iv)
                      return iv
                  }
              }

              private inner class VaultPageHolder(val imageView: GestureImageView) : RecyclerView.ViewHolder(imageView)

              private inner class VaultPagerAdapter(private val items: List<File>) : RecyclerView.Adapter<VaultPageHolder>() {
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VaultPageHolder {
                      val iv = GestureImageView(parent.context).apply {
                          layoutParams = ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT,
                          )
                          setBackgroundColor(Color.BLACK)
                          setOnClickListener { toggleViewerBars() }
                      }
                      return VaultPageHolder(iv)
                  }

                  override fun onBindViewHolder(holder: VaultPageHolder, position: Int) {
                      Glide.with(this@VaultActivity).load(items[position]).into(holder.imageView)
                  }

                  override fun getItemCount(): Int = items.size
              }
          }
          """
              write_file(act, content)
              print(f"Created {act}")

          def register_vault_activity_in_manifest() -> None:
              code = read_file(MANIFEST)
              if "org.fossify.gallery.activities.VaultActivity" in code:
                  return
              entry = (
                  '\n        <activity\n'
                  '            android:name="org.fossify.gallery.activities.VaultActivity"\n'
                  '            android:exported="false"\n'
                  '            android:theme="@android:style/Theme.Material.NoActionBar" />\n'
              )
              new_code, hits = re.subn(r"</application>", entry + "    </application>", code, count=1)
              if hits == 0:
                  raise RuntimeError("Could not locate </application> in AndroidManifest.xml")
              write_file(MANIFEST, new_code)
              print(f"Registered VaultActivity in {MANIFEST}")

          def replace_balanced_call(code: str, pattern: str, transform) -> tuple[str, int]:
              out = []
              idx = 0
              count = 0
              for match in re.finditer(pattern, code):
                  start = match.start()
                  if start < idx:
                      continue
                  open_paren = match.end() - 1
                  depth = 0
                  in_str = None
                  escaped = False
                  end = open_paren
                  for pos in range(open_paren, len(code)):
                      ch = code[pos]
                      if escaped:
                          escaped = False
                          continue
                      if in_str:
                          if ch == "\\":
                              escaped = True
                          elif ch == in_str:
                              in_str = None
                          continue
                      if ch in ('"', "'"):
                          in_str = ch
                      elif ch == "(":
                          depth += 1
                      elif ch == ")":
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  if depth != 0:
                      continue
                  out.append(code[idx:start])
                  out.append(transform(match, code[start:end]))
                  idx = end
                  count += 1
              out.append(code[idx:])
              return "".join(out), count

          def ensure_import(code: str, import_line: str) -> str:
              if import_line in code:
                  return code
              return re.sub(
                  r"(^package\s+[^\n]+\n)",
                  r"\1\n" + import_line + "\n",
                  code,
                  count=1,
                  flags=re.MULTILINE,
              )

          def patch_media_fetcher() -> None:
              path = ROOT / "helpers/MediaFetcher.kt"
              code = read_file(path)
              m = re.search(
                  r"fun\s+groupMedia\s*\(\s*(\w+)\s*:[^,]+,\s*(\w+)\s*:[^)]*\)[^{]*\{",
                  code,
              )
              if not m:
                  raise RuntimeError("Could not locate groupMedia() in MediaFetcher.kt")
              param_media, param_path = m.group(1), m.group(2)
              guard = (
                  f"\n        val noDateGrouping = context.config.getFolderGrouping({param_path})\n"
                  f"        if ((noDateGrouping and (GROUP_BY_DATE_TAKEN_DAILY or GROUP_BY_DATE_TAKEN_MONTHLY "
                  f"or GROUP_BY_LAST_MODIFIED_DAILY or GROUP_BY_LAST_MODIFIED_MONTHLY)) != 0) {{\n"
                  f"            return ArrayList({param_media})\n"
                  f"        }}\n"
              )
              code = code[:m.end()] + guard + code[m.end():]
              code, fmt_hits = re.subn(
                  r"(fun\s+formatDate\s*\([^)]*\)[^{]*\{)",
                  r'\1\n        return ""',
                  code,
                  count=1,
              )
              write_file(path, code)
              print(f"Patched {path} (groupMedia guarded, formatDate hits={fmt_hits})")

          def patch_view_pager_fragment() -> None:
              path = ROOT / "fragments/ViewPagerFragment.kt"
              code = read_file(path)
              code, hits = re.subn(r"\b(EXT_DATE_TAKEN|EXT_LAST_MODIFIED)\b", "0", code)
              if hits == 0:
                  raise RuntimeError("Could not locate EXT_DATE_TAKEN/EXT_LAST_MODIFIED in ViewPagerFragment.kt")
              write_file(path, code)
              print(f"Patched {path} (extended details date flags disabled, hits={hits})")

          def patch_adapters_format_date() -> None:
              for rel in ("adapters/MediaAdapter.kt", "adapters/DirectoryAdapter.kt"):
                  path = ROOT / rel
                  code = read_file(path)
                  code, hits = replace_balanced_call(
                      code,
                      r"\.formatDate\s*\(",
                      lambda _m, _call: '.let { "" }',
                  )
                  write_file(path, code)
                  print(f"Patched {path} (formatDate calls blanked={hits})")

          def patch_properties_dialogs() -> None:
              total = 0
              for kt_file in ROOT.rglob("*.kt"):
                  if kt_file.name in ("NoDatePropertiesHelper.kt", "VaultManager.kt", "VaultActivity.kt"):
                      continue
                  code = read_file(kt_file)
                  if "PropertiesDialog(" not in code:
                      continue
                  new_code, hits = replace_balanced_call(
                      code,
                      r"(?<![.\w])PropertiesDialog\s*\(",
                      lambda _m, call: f"{call}.stripDateRows()",
                  )
                  if hits > 0:
                      new_code = ensure_import(new_code, "import org.fossify.gallery.helpers.stripDateRows")
                      write_file(kt_file, new_code)
                      total += hits
                      print(f"Patched {kt_file} (PropertiesDialog calls wrapped={hits})")
              if total == 0:
                  raise RuntimeError("No PropertiesDialog() calls found to wrap")

          def inject_menu_hook(path: pathlib.Path, menu_expr: str, menu_id: int, title: str, action_kotlin: str) -> None:
              code = read_file(path)

              setup_match = re.search(r"fun\s+setupOptionsMenu\s*\(\s*\)\s*\{", code)
              if not setup_match:
                  raise RuntimeError(f"Could not locate setupOptionsMenu() in {path}")
              add_item = (
                  f'\n        if ({menu_expr}.findItem({menu_id}) == null) {{\n'
                  f'            {menu_expr}.add(0, {menu_id}, 0, "{title}")\n'
                  f'        }}\n'
              )
              code = code[:setup_match.end()] + add_item + code[setup_match.end():]

              click_match = re.search(
                  r"setOnMenuItemClickListener\s*\{(?:\s*(\w+)\s*->)?",
                  code,
              )
              if not click_match:
                  raise RuntimeError(f"Could not locate setOnMenuItemClickListener in {path}")
              item_var = click_match.group(1) or "it"
              click_handler = (
                  f'\n            if ({item_var}.itemId == {menu_id}) {{\n'
                  f'                {action_kotlin}\n'
                  f'                return@setOnMenuItemClickListener true\n'
                  f'            }}\n'
              )
              code = code[:click_match.end()] + click_handler + code[click_match.end():]
              code = ensure_import(code, "import org.fossify.gallery.helpers.VaultManager")
              write_file(path, code)
              print(f"Injected '{title}' menu hook into {path}")

          def patch_vault_menus() -> None:
              inject_menu_hook(
                  ROOT / "activities/MainActivity.kt",
                  "binding.mainMenu.toolbar!!.menu",
                  991001,
                  "Private Vault",
                  "VaultManager.promptAndOpenVault(this)",
              )
              inject_menu_hook(
                  ROOT / "activities/MediaActivity.kt",
                  "binding.mediaMenu.toolbar!!.menu",
                  991003,
                  "Private Vault",
                  "VaultManager.promptAndOpenVault(this)",
              )
              inject_menu_hook(
                  ROOT / "activities/ViewPagerActivity.kt",
                  "binding.mediumViewerToolbar.menu",
                  991002,
                  "Move to Vault",
                  "getCurrentMedium()?.path?.let { p -> VaultManager.moveToVault(this, p) { finish() } }",
              )

          def main() -> None:
              create_properties_helper()
              create_vault_manager()
              create_vault_activity()
              register_vault_activity_in_manifest()
              patch_media_fetcher()
              patch_view_pager_fragment()
              patch_adapters_format_date()
              patch_properties_dialogs()
              patch_vault_menus()
              print("All No-DateTime + Private Vault patches applied successfully.")

          if __name__ == "__main__":
              try:
                  main()
              except Exception as err:
                  print(f"PATCH ERROR: {err}", file=sys.stderr)
                  sys.exit(1)
          PYEOF

      - name: Build universal FOSS release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk/foss/release -name "*foss-release*.apk" ! -name "*armeabi*" ! -name "*arm64*" ! -name "*x86*" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/foss/release -name "*.apk" | head -n 1)
          fi
          echo "Signing: $RAW_APK"

          keytool -genkeypair -v \
            -keystore custom.keystore \
            -alias customkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass custompass -keypass custompass \
            -dname "CN=CustomGallery, OU=Personal, O=Personal, L=Local, S=Local, C=IN"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks custom.keystore \
            --ks-key-alias customkey \
            --ks-pass pass:custompass \
            --key-pass pass:custompass \
            --out FossifyGallery-NoDateTime.apk \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify FossifyGallery-NoDateTime.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FossifyGallery-NoDateTime
          path: FossifyGallery-NoDateTime.apk
