                  override fun onBindViewHolder(holder: VaultPageHolder, position: Int) {
                      val file = items[position]
                      if (VaultManager.isVideoFile(file)) {
                          holder.imageView.visibility = View.VISIBLE
                          holder.videoView.visibility = View.GONE
                          holder.playButton.visibility = View.VISIBLE
                          Glide.with(this@VaultActivity)
                              .load(file)
                              .apply(RequestOptions().format(DecodeFormat.PREFER_ARGB_8888))
                              .into(holder.imageView)
                          holder.playButton.setOnClickListener {
                              stopActiveVideo()
                              holder.imageView.visibility = View.GONE
                              holder.playButton.visibility = View.GONE
                              holder.videoView.visibility = View.VISIBLE
                              val controller = MediaController(this@VaultActivity)
                              controller.setAnchorView(holder.videoView)
                              holder.videoView.setMediaController(controller)
                              holder.videoView.setVideoURI(Uri.fromFile(file))
                              holder.videoView.setOnCompletionListener {
                                  holder.playButton.visibility = View.VISIBLE
                              }
                              activeVideoView = holder.videoView
                              holder.videoView.start()
                              resetInactivityTimer()
                          }
                      } else {
                          holder.videoView.visibility = View.GONE
                          holder.playButton.visibility = View.GONE
                          holder.imageView.visibility = View.VISIBLE
                          Glide.with(this@VaultActivity)
                              .load(file)
                              .apply(
                                  RequestOptions()
                                      .format(DecodeFormat.PREFER_ARGB_8888)
                                      .override(4096)
                                      .fitCenter()
                              )
                              .into(holder.imageView)
                      }
                  }

                  override fun getItemCount(): Int = items.size
              }
          }
