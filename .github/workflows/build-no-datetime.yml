          def replace_balanced_call(code: str, pattern: str, transform) -> tuple[str, int]:
              out = []
              idx = 0
              count = 0
              for match in re.finditer(pattern, code):
                  start = match.start()
                  if start < idx:
                      continue
                  open_paren = match.end() - 1
                  depth = 0
                  in_str = None
                  escaped = False
                  end = open_paren
                  for pos in range(open_paren, len(code)):
                      ch = code[pos]
                      if escaped:
                          escaped = False
                          continue
                      if in_str:
                          if ch == "\\":
                              escaped = True
                          elif ch == in_str:
                              in_str = None
                          continue
                      if ch in ('"', "'"):
                          in_str = ch
                      elif ch == "(":
                          depth += 1
                      elif ch == ")":
                          depth -= 1
                          if depth == 0:
                              end = pos + 1
                              break
                  if depth != 0:
                      continue
                  out.append(code[idx:start])
                  out.append(transform(match, code[start:end]))
                  idx = end
                  count += 1
              out.append(code[idx:])
              return "".join(out), count

          def ensure_import(code: str, import_line: str) -> str:
              if import_line in code:
                  return code
              return re.sub(
                  r"(^package\s+[^\n]+\n)",
                  r"\1\n" + import_line + "\n",
                  code,
                  count=1,
                  flags=re.MULTILINE,
              )

          def patch_media_fetcher() -> None:
              path = ROOT / "helpers/MediaFetcher.kt"
              code = read_file(path)
              m = re.search(
